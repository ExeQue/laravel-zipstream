services:
  php:
    build:
      context: ./docker
    volumes:
      - .:/var/www/html
    environment:
      - XDEBUG_MODE=coverage
      - ZIPSTREAM_S3_ENDPOINT=http://minio:9000
  composer:
    extends:
      service: php
    ports:
        - "8000:8000"
    volumes:
      - .:/var/www/html
      - ~/.cache/composer:/.composer/cache
    entrypoint: [ "composer" ]
  testbench:
    extends:
      service: php
    volumes:
      - .:/var/www/html
    entrypoint: [ "vendor/bin/testbench" ]
  # S3-compatible storage for tests/Feature/SaveToS3Test.php - `docker compose up -d minio`.
  # From the host: ZIPSTREAM_S3_ENDPOINT=http://localhost:9000 vendor/bin/pest
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
