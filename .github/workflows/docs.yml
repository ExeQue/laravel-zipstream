name: Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'README.md'
      - 'UPGRADE.md'
      - 'LICENSE.md'
      - 'docs/**'
      - 'contributing/**'
      - '.vitepress/**'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'UPGRADE.md'
      - 'docs/**'
      - 'contributing/**'
      - '.vitepress/**'
      - 'package.json'
  workflow_dispatch:

# The build runs on a pull request too: VitePress fails on a dead link, which is
# the check that matters. A pull request stops there; main and a manual run deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # for lastUpdated timestamps

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run docs:build

      - name: Upload the artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
